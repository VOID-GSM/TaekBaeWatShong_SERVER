spring:
  application:
    name: TaekBaeWatShong-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:

      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
          datagsm:
            client-id: ${DATAGSM_CLIENT_ID}
            client-secret: ${DATAGSM_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: DataGSM
            scope: "datagsm:self_read"
        provider:
          datagsm:
            authorization-uri: https://oauth.authorization.datagsm.kr/v1/oauth/authorize
            token-uri: https://oauth.authorization.datagsm.kr/v1/oauth/token
            user-info-uri: https://oauth.resource.datagsm.kr/userinfo
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
    admin-redirect-uri: ${ADMIN_OAUTH2_REDIRECT_URI:http://localhost:3001/oauth2/redirect}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  admin:
    emails: ${ADMIN_EMAILS:}

apick:
  api-key: ${APICK_API_KEY:}

notification:
  unclaimed-reminder:
    cron: ${UNCLAIMED_REMINDER_CRON:0 0 8 * * *}
    days: ${UNCLAIMED_REMINDER_DAYS:1,3,5}