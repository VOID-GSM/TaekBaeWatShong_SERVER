spring:
  application:
    name: TaekBaeWatShong-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:

      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 프록시가 원래 프로토콜을 넘기지 않으면 {baseUrl}이 http로 만들어지므로, 배포 서버는 OAUTH2_CALLBACK_BASE_URL로 https 주소를 고정한다.
            redirect-uri: "${OAUTH2_CALLBACK_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            scope: email,profile
          datagsm:
            client-id: ${DATAGSM_CLIENT_ID}
            client-secret: ${DATAGSM_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_CALLBACK_BASE_URL:{baseUrl}}/login/oauth2/code/{registrationId}"
            client-name: DataGSM
            scope: "datagsm:self_read"
        provider:
          datagsm:
            authorization-uri: https://oauth.authorization.datagsm.kr/v1/oauth/authorize
            token-uri: https://oauth.authorization.datagsm.kr/v1/oauth/token
            user-info-uri: https://oauth.resource.datagsm.kr/userinfo
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 3600000

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
    admin-redirect-uri: ${ADMIN_OAUTH2_REDIRECT_URI:http://localhost:3001/oauth2/redirect}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  admin:
    emails: ${ADMIN_EMAILS:}

apick:
  api-key: ${APICK_API_KEY:}

notification:
  unclaimed-reminder:
    cron: ${UNCLAIMED_REMINDER_CRON:0 0 8 * * *}
    days: ${UNCLAIMED_REMINDER_DAYS:1,3,5}
  push:
    enabled: ${PUSH_ENABLED:true}
    android-channel-id: ${PUSH_ANDROID_CHANNEL_ID:}
    expo:
      url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
      # Expo 대시보드에서 "Enhanced security for push notifications"를 켠 경우에만 필요
      access-token: ${EXPO_ACCESS_TOKEN:}

server:
  # 리버스 프록시(HTTPS 종료) 뒤에서 X-Forwarded-Proto/Host를 신뢰해 {baseUrl}과 리다이렉트를 https로 만든다.
  forward-headers-strategy: framework

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
