name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: taekbaewatshong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 테스트용 더미 값 (실제 시크릿 아님)
    env:
      DB_URL: jdbc:mysql://localhost:3306/taekbaewatshong
      DB_USERNAME: root
      DB_PASSWORD: test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      DATAGSM_CLIENT_ID: ci-dummy-client-id
      DATAGSM_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ① 정적 분석 & 린팅
      - name: Lint (ktlint)
        id: lint
        run: ./gradlew ktlintCheck

      # ② 자동 테스트
      - name: Test
        id: test
        run: ./gradlew test

      - name: Upload test reports
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      # ③ 빌드 & 아티팩트 생성
      - name: Build
        id: build
        run: ./gradlew bootJar -x test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ④ 결과 알림 (취소된 실행은 보내지 않음)
      - name: Collect stage results
        if: ${{ !cancelled() }}
        id: stages
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              *) printf '⏭️' ;;
            esac
          }
          echo "summary=$(icon "$LINT_OUTCOME") 린팅  ›  $(icon "$TEST_OUTCOME") 테스트  ›  $(icon "$BUILD_OUTCOME") 빌드" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CI
          stages: ${{ steps.stages.outputs.summary }}

  # ⑤ 배포 (develop / main 푸시 + CI 통과 시에만) — GSMSV 서버에 SSH로 배포
  #   develop → development 환경 서버, main → production 환경 서버
  #   GitHub에는 SSH 비밀번호(Environment 시크릿 SSH_PASSWORD)만 두고,
  #   앱 환경변수(DB·JWT·OAuth·CORS 등)는 서버의 .env 파일을 그대로 읽는다.
  deploy:
    name: Deploy to GSMSV (${{ github.ref_name }})
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      SSH_HOST: ssh.gsmsv.site
      SSH_USER: ubuntu
      SSH_PORT: ${{ github.ref_name == 'main' && '21132' || '24179' }}
      # jar·로그·pid를 두는 디렉터리
      APP_DIR: /home/ubuntu/taekbaewatshong
      # 서버에서 직접 관리하는 앱 환경변수 파일
      ENV_FILE: /home/ubuntu/TaekBaeWatShong_SERVER/.env
      # 기존 수동 배포와 같은 포트
      APP_PORT: '8080'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Prepare jar
        run: |
          JAR=$(ls dist/*.jar | grep -v -- '-plain.jar' | head -n 1)
          test -n "$JAR"
          mv "$JAR" dist/app.jar

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload jar
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p $SSH_PORT"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR/release'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT" dist/app.jar "$SSH_USER@$SSH_HOST:$APP_DIR/release/app.jar"

      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          {
            printf 'export APP_DIR=%q ENV_FILE=%q APP_PORT=%q\n' "$APP_DIR" "$ENV_FILE" "$APP_PORT"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          if ! command -v java >/dev/null 2>&1; then
            echo "::error::서버에 java가 설치되어 있지 않습니다 (Java 21 필요)"
            exit 1
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::환경변수 파일이 없습니다: $ENV_FILE"
            exit 1
          fi

          # .env 로드 — 값을 셸로 해석하지 않고 KEY=VALUE 그대로 export 한다 (빈 줄·주석 무시, 양끝 따옴표 제거)
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key="$(printf '%s' "$key" | sed 's/^export[[:space:]]*//; s/[[:space:]]*$//')"
            case "$value" in \"*\") value="${value#\"}"; value="${value%\"}" ;; \'*\') value="${value#\'}"; value="${value%\'}" ;; esac
            export "$key=$value"
          done < "$ENV_FILE"
          export SERVER_PORT="$APP_PORT"

          # 기존 프로세스 종료 — 이 워크플로가 띄운 jar와 수동으로 띄운 jar 모두
          PIDS="$(pgrep -u "$(id -u)" -f "java .*-jar .*(TaekBaeWatShong-server.*\\.jar|$APP_DIR/app\\.jar)" | tr '\n' ' ' || true)"
          for pid in $PIDS; do kill "$pid" 2>/dev/null || true; done
          for _ in $(seq 1 30); do
            alive=""
            for pid in $PIDS; do kill -0 "$pid" 2>/dev/null && alive="$alive $pid"; done
            [ -z "$alive" ] && break
            sleep 1
          done
          for pid in $PIDS; do kill -9 "$pid" 2>/dev/null || true; done

          # 포트가 비워질 때까지 대기
          #   파이프(grep -q) 없이 ss 필터 결과만 보므로 pipefail + SIGPIPE 경합이 없다
          port_busy() { command -v ss >/dev/null 2>&1 && [ -n "$(ss -Hltn "sport = :$APP_PORT")" ]; }
          for _ in $(seq 1 15); do
            port_busy || break
            sleep 1
          done
          if port_busy; then
            echo "::error::$APP_PORT 포트를 다른 프로세스가 사용 중입니다 (아래 점유 프로세스 확인)"
            ss -Hltnp "sport = :$APP_PORT" || true
            for pid in $(ss -Hltnp "sport = :$APP_PORT" 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u); do
              ps -o pid,user,cmd -p "$pid" || true
            done
            exit 1
          fi

          mv -f release/app.jar app.jar
          if [ -f app.log ]; then mv -f app.log app.log.prev; fi

          nohup java -jar "$APP_DIR/app.jar" > app.log 2>&1 < /dev/null &
          echo $! > app.pid
          NEW_PID=$(cat app.pid)

          # 기동 확인 (최대 120초)
          for _ in $(seq 1 120); do
            if ! kill -0 "$NEW_PID" 2>/dev/null; then
              echo "::error::애플리케이션이 기동 중 종료되었습니다"
              tail -n 80 app.log
              exit 1
            fi
            if grep -q "Started .* in .* seconds" app.log; then
              echo "애플리케이션 기동 완료 (PID $NEW_PID, 포트 $APP_PORT)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::120초 안에 기동 로그를 확인하지 못했습니다"
          tail -n 80 app.log
          exit 1
          REMOTE
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s'

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CD
