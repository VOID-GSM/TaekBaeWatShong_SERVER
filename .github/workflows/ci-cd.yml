name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: taekbaewatshong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 테스트용 더미 값 (실제 시크릿 아님)
    env:
      DB_URL: jdbc:mysql://localhost:3306/taekbaewatshong
      DB_USERNAME: root
      DB_PASSWORD: test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ① 정적 분석 & 린팅
      - name: Lint (ktlint)
        id: lint
        run: ./gradlew ktlintCheck

      # ② 자동 테스트
      - name: Test
        id: test
        run: ./gradlew test

      - name: Upload test reports
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      # ③ 빌드 & 아티팩트 생성
      - name: Build
        id: build
        run: ./gradlew bootJar -x test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ④ 결과 알림 (취소된 실행은 보내지 않음)
      - name: Collect stage results
        if: ${{ !cancelled() }}
        id: stages
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              *) printf '⏭️' ;;
            esac
          }
          echo "summary=$(icon "$LINT_OUTCOME") 린팅  $(icon "$TEST_OUTCOME") 테스트  $(icon "$BUILD_OUTCOME") 빌드" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CI
          stages: ${{ steps.stages.outputs.summary }}

  # ⑤ 배포 (develop 푸시 + CI 통과 시에만)
  deploy:
    name: Deploy to Cloudtype
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: s25020/taekbaewatshong-server
          stage: main
          yaml: |
            name: taekbaewatshong-server
            app: java@21
            options:
              ports: "8080"
              start: java -jar build/libs/TaekBaeWatShong-server-0.0.1-SNAPSHOT.jar
              env:
                - name: GOOGLE_CLIENT_ID
                  value: "${{ secrets.GOOGLE_CLIENT_ID }}"
                - name: GOOGLE_CLIENT_SECRET
                  value: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
                - name: JWT_SECRET
                  value: "${{ secrets.JWT_SECRET }}"
                - name: DB_URL
                  value: "${{ secrets.DB_URL }}"
                - name: DB_USERNAME
                  value: "${{ secrets.DB_USERNAME }}"
                - name: DB_PASSWORD
                  value: "${{ secrets.DB_PASSWORD }}"
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CD
