name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: taekbaewatshong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 테스트용 더미 값 (실제 시크릿 아님)
    env:
      DB_URL: jdbc:mysql://localhost:3306/taekbaewatshong
      DB_USERNAME: root
      DB_PASSWORD: test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      DATAGSM_CLIENT_ID: ci-dummy-client-id
      DATAGSM_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ① 정적 분석 & 린팅
      - name: Lint (ktlint)
        id: lint
        run: ./gradlew ktlintCheck

      # ② 자동 테스트
      - name: Test
        id: test
        run: ./gradlew test

      - name: Upload test reports
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      # ③ 빌드 & 아티팩트 생성
      - name: Build
        id: build
        run: ./gradlew bootJar -x test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ④ 결과 알림 (취소된 실행은 보내지 않음)
      - name: Collect stage results
        if: ${{ !cancelled() }}
        id: stages
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              *) printf '⏭️' ;;
            esac
          }
          echo "summary=$(icon "$LINT_OUTCOME") 린팅  ›  $(icon "$TEST_OUTCOME") 테스트  ›  $(icon "$BUILD_OUTCOME") 빌드" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CI
          stages: ${{ steps.stages.outputs.summary }}

  # ⑤ 배포 (develop / main 푸시 + CI 통과 시에만) — GSMSV 서버에 SSH로 배포
  #   develop → development 환경 서버, main → production 환경 서버
  #   비밀번호 등 민감 정보는 GitHub Environment 시크릿(SSH_PASSWORD)으로만 관리한다.
  deploy:
    name: Deploy to GSMSV (${{ github.ref_name }})
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      SSH_HOST: ssh.gsmsv.site
      SSH_USER: ubuntu
      SSH_PORT: ${{ github.ref_name == 'main' && '21132' || '24179' }}
      APP_DIR: /home/ubuntu/taekbaewatshong
      # GSMSV는 VM의 80(HTTP 포트)·10000(SVC 포트)만 외부로 열어준다.
      # ubuntu 계정은 80을 직접 바인딩할 수 없으므로 SVC 포트(10000)로 띄운다.
      # nginx 등으로 80 → 다른 포트를 프록시하고 있다면 이 값을 그 포트로 바꾼다.
      APP_PORT: '10000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Prepare jar
        run: |
          JAR=$(ls dist/*.jar | grep -v -- '-plain.jar' | head -n 1)
          test -n "$JAR"
          mv "$JAR" dist/app.jar

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload jar
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p $SSH_PORT"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR/release'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT" dist/app.jar "$SSH_USER@$SSH_HOST:$APP_DIR/release/app.jar"

      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATAGSM_CLIENT_ID: ${{ secrets.DATAGSM_CLIENT_ID }}
          DATAGSM_CLIENT_SECRET: ${{ secrets.DATAGSM_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # 앱 환경변수는 서버 디스크에 남기지 않고 SSH 세션의 stdin으로만 전달한다.
          {
            for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET DATAGSM_CLIENT_ID DATAGSM_CLIENT_SECRET JWT_SECRET DB_URL DB_USERNAME DB_PASSWORD; do
              printf 'export %s=%q\n' "$k" "${!k}"
            done
            printf 'export APP_DIR=%q\n' "$APP_DIR"
            printf 'export SERVER_PORT=%q\n' "$APP_PORT"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          if ! command -v java >/dev/null 2>&1; then
            echo "::error::서버에 java가 설치되어 있지 않습니다 (Java 21 필요)"
            exit 1
          fi

          # 기존 프로세스 종료
          if [ -f app.pid ] && kill -0 "$(cat app.pid)" 2>/dev/null; then
            OLD_PID=$(cat app.pid)
            kill "$OLD_PID"
            for _ in $(seq 1 30); do kill -0 "$OLD_PID" 2>/dev/null || break; sleep 1; done
            kill -9 "$OLD_PID" 2>/dev/null || true
          fi
          pkill -f "$APP_DIR/app.jar" 2>/dev/null || true

          mv -f release/app.jar app.jar
          [ -f app.log ] && mv -f app.log app.log.prev

          nohup java -jar "$APP_DIR/app.jar" > app.log 2>&1 < /dev/null &
          echo $! > app.pid
          NEW_PID=$(cat app.pid)

          # 기동 확인 (최대 120초)
          for _ in $(seq 1 120); do
            if ! kill -0 "$NEW_PID" 2>/dev/null; then
              echo "::error::애플리케이션이 기동 중 종료되었습니다"
              tail -n 80 app.log
              exit 1
            fi
            if grep -q "Started .* in .* seconds" app.log; then
              echo "애플리케이션 기동 완료 (PID $NEW_PID)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::120초 안에 기동 로그를 확인하지 못했습니다"
          tail -n 80 app.log
          exit 1
          REMOTE
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s'

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CD
