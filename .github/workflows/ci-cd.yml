name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: taekbaewatshong
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # 테스트용 더미 값 (실제 시크릿 아님)
    env:
      DB_URL: jdbc:mysql://localhost:3306/taekbaewatshong
      DB_USERNAME: root
      DB_PASSWORD: test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      DATAGSM_CLIENT_ID: ci-dummy-client-id
      DATAGSM_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ① 정적 분석 & 린팅
      - name: Lint (ktlint)
        id: lint
        run: ./gradlew ktlintCheck

      # ② 자동 테스트
      - name: Test
        id: test
        run: ./gradlew test

      - name: Upload test reports
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      # ③ 빌드 & 아티팩트 생성
      - name: Build
        id: build
        run: ./gradlew bootJar -x test

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 7

      # ④ 결과 알림 (취소된 실행은 보내지 않음)
      - name: Collect stage results
        if: ${{ !cancelled() }}
        id: stages
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          icon() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              *) printf '⏭️' ;;
            esac
          }
          echo "summary=$(icon "$LINT_OUTCOME") 린팅  ›  $(icon "$TEST_OUTCOME") 테스트  ›  $(icon "$BUILD_OUTCOME") 빌드" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CI
          stages: ${{ steps.stages.outputs.summary }}

  # ⑤ 배포 (develop / main 푸시 + CI 통과 시에만) — GSMSV 서버에 SSH로 배포
  #   develop → development 환경 서버, main → production 환경 서버
  #   GitHub에는 SSH 비밀번호(Environment 시크릿 SSH_PASSWORD)만 두고,
  #   앱은 systemd 사용자 유닛(taekbaewatshong.service)으로 실행한다.
  #   - 환경변수: 서버의 .env를 systemd EnvironmentFile로 읽음 (셸 파싱 없음)
  #   - 재부팅 시 자동 기동, 비정상 종료 시 재시작
  #   - 기동 실패 시 직전 jar로 자동 롤백
  #   서버 1회 준비: sudo loginctl enable-linger ubuntu
  deploy:
    name: Deploy to GSMSV (${{ github.ref_name }})
    needs: build
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    env:
      SSH_HOST: ssh.gsmsv.site
      SSH_USER: ubuntu
      SSH_PORT: ${{ github.ref_name == 'main' && '21132' || '24179' }}
      # jar·로그를 두는 디렉터리
      APP_DIR: /home/ubuntu/taekbaewatshong
      # 서버에서 직접 관리하는 앱 환경변수 파일. 앱의 작업 디렉터리도 이 파일이 있는 곳(기존 수동 배포와 동일)으로 둔다.
      ENV_FILE: /home/ubuntu/TaekBaeWatShong_SERVER/.env
      # 기존 수동 배포와 같은 포트.
      # 참고: GSMSV 문서상 외부로 바로 열리는 VM 포트는 80(HTTP)·10000(SVC)뿐이다.
      #       8080을 외부에 노출하는 경로(프록시·포워딩 등)를 바꾸면 이 값도 함께 맞춘다.
      APP_PORT: '8080'
      SERVICE: taekbaewatshong

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Prepare jar
        run: |
          JAR=$(ls dist/*.jar | grep -v -- '-plain.jar' | head -n 1)
          test -n "$JAR"
          mv "$JAR" dist/app.jar

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload jar
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p $SSH_PORT"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR/release'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -P "$SSH_PORT" dist/app.jar "$SSH_USER@$SSH_HOST:$APP_DIR/release/app.jar"

      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          {
            printf 'readonly APP_DIR=%q ENV_FILE=%q APP_PORT=%q SERVICE=%q\n' "$APP_DIR" "$ENV_FILE" "$APP_PORT" "$SERVICE"
            cat <<'REMOTE'
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          cd "$APP_DIR"

          fail() { echo "::error::$*"; exit 1; }

          JAVA_BIN="$(command -v java)" || fail "서버에 java가 설치되어 있지 않습니다 (Java 21 필요)"
          [ -f "$ENV_FILE" ] || fail "환경변수 파일이 없습니다: $ENV_FILE"
          [ "$(loginctl show-user "$(id -un)" -p Linger --value 2>/dev/null || true)" = "yes" ] \
            || fail "systemd linger가 꺼져 있습니다. 서버에서 1회 실행: sudo loginctl enable-linger $(id -un)"

          # systemd 사용자 유닛 작성 (매 배포마다 덮어써서 워크플로와 항상 일치시킴)
          UNIT_DIR="$HOME/.config/systemd/user"
          mkdir -p "$UNIT_DIR"
          cat > "$UNIT_DIR/$SERVICE.service" <<UNIT
          [Unit]
          Description=TaekBaeWatShong server
          After=network-online.target

          [Service]
          WorkingDirectory=$(dirname "$ENV_FILE")
          Environment=SERVER_PORT=$APP_PORT
          EnvironmentFile=$ENV_FILE
          ExecStart=$JAVA_BIN -jar $APP_DIR/app.jar
          Restart=on-failure
          RestartSec=5
          SuccessExitStatus=143
          StandardOutput=append:$APP_DIR/app.log
          StandardError=inherit

          [Install]
          WantedBy=default.target
          UNIT
          systemctl --user daemon-reload
          systemctl --user enable "$SERVICE" >/dev/null

          # 기동 확인: 로그의 Started 라인 + HTTP 응답(상태 코드 무관, 연결만 확인)
          wait_started() {
            local limit="$1"
            for _ in $(seq 1 "$limit"); do
              if systemctl --user is-failed --quiet "$SERVICE" \
                || [ "$(systemctl --user show -p NRestarts --value "$SERVICE")" != "0" ]; then
                return 1
              fi
              if grep -q "Started .* in .* seconds" app.log 2>/dev/null \
                && [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$APP_PORT/" || true)" != "000" ]; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          start_service() {
            if [ -f app.log ]; then mv -f app.log app.log.prev; fi
            systemctl --user reset-failed "$SERVICE" 2>/dev/null || true
            systemctl --user start "$SERVICE"
          }

          # 1) 현재 서비스 중지
          systemctl --user stop "$SERVICE" 2>/dev/null || true

          # 2) systemd 밖에서 수동으로 띄운 인스턴스가 있으면 종료 (최초 전환 1회용)
          #    종료 전에 그 jar 경로를 기억해 두었다가, 새 버전이 실패하면 그 jar로 롤백한다.
          MANUAL_JAR=""
          MANUAL_PIDS="$(pgrep -u "$(id -u)" -f 'java .*-jar .*TaekBaeWatShong-server.*\.jar' | tr '\n' ' ' || true)"
          if [ -n "$MANUAL_PIDS" ]; then
            for pid in $MANUAL_PIDS; do
              jar="$(tr '\0' '\n' < "/proc/$pid/cmdline" 2>/dev/null | grep '\.jar$' | head -n 1 || true)"
              case "$jar" in /*) ;; ?*) jar="$(readlink "/proc/$pid/cwd")/$jar" ;; esac
              if [ -n "$jar" ] && [ -f "$jar" ]; then MANUAL_JAR="$jar"; fi
            done
            echo "수동 실행 인스턴스 종료: $MANUAL_PIDS (jar: ${MANUAL_JAR:-알 수 없음})"
            kill $MANUAL_PIDS 2>/dev/null || true
            for _ in $(seq 1 30); do
              alive=""; for pid in $MANUAL_PIDS; do kill -0 "$pid" 2>/dev/null && alive=1; done
              [ -z "$alive" ] && break; sleep 1
            done
            kill -9 $MANUAL_PIDS 2>/dev/null || true
          fi

          # 3) 포트 비었는지 확인 (파이프 없이 ss 필터 결과만 확인)
          port_busy() { [ -n "$(ss -Hltn "sport = :$APP_PORT" 2>/dev/null)" ]; }
          for _ in $(seq 1 15); do port_busy || break; sleep 1; done
          if port_busy; then
            echo "::error::$APP_PORT 포트를 다른 프로세스가 사용 중입니다"
            ss -Hltnp "sport = :$APP_PORT" || true
            exit 1
          fi

          # 4) 직전 jar 보관 후 교체·기동
          HAS_PREV=""
          if [ -n "$MANUAL_JAR" ]; then cp -f "$MANUAL_JAR" app.jar.prev; HAS_PREV=1
          elif [ -f app.jar ]; then cp -f app.jar app.jar.prev; HAS_PREV=1; fi
          mv -f release/app.jar app.jar
          start_service

          if wait_started 120; then
            echo "애플리케이션 기동 완료 (포트 $APP_PORT, $(systemctl --user show -p MainPID --value "$SERVICE"))"
            exit 0
          fi

          echo "::error::새 버전 기동 실패 — 로그 마지막 80줄"
          tail -n 80 app.log || true
          cp -f app.log app.log.failed 2>/dev/null || true

          # 5) 롤백
          systemctl --user stop "$SERVICE" || true
          if [ -n "$HAS_PREV" ]; then
            echo "직전 버전(app.jar.prev)으로 롤백합니다"
            cp -f app.jar.prev app.jar
            start_service
            if wait_started 120; then
              echo "::warning::롤백 완료 — 직전 버전으로 서비스 중 (실패 로그: $APP_DIR/app.log.failed)"
            else
              echo "::error::롤백 버전도 기동 실패"
              tail -n 40 app.log || true
            fi
          else
            echo "::error::롤백할 직전 jar가 없습니다 (최초 배포). 서버에서 수동 확인이 필요합니다"
          fi
          exit 1
          REMOTE
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s'

      - name: Notify Discord
        if: ${{ !cancelled() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          kind: CD
